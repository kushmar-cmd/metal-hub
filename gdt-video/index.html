:root{
  --canvas:#E4E1DC; --ink:#000; --paper:#fff; --muted:rgba(0,0,0,.55); --line:#000; --soft:#D2CEC7;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--canvas);color:var(--ink);font-family:"Geist","Heebo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.wrap{max-width:1440px;margin:0 auto;padding:40px 40px 64px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:32px}
h1{font-size:clamp(34px,4.2vw,58px);font-weight:650;letter-spacing:-.02em;line-height:1;margin:0}
.sub{margin-top:14px;font-size:18px;color:var(--muted);line-height:1.5}
.std{font-size:15px;color:var(--muted);direction:ltr;white-space:nowrap}
.grid{display:grid;grid-template-columns:400px minmax(0,1fr);gap:32px;align-items:start}
.list{order:-1}
/* player */
.player{position:sticky;top:24px}
video{display:block;width:100%;aspect-ratio:16/9;background:var(--canvas);border:2.5px solid var(--line)}
.now{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px}
.now h2{margin:0;font-size:clamp(22px,2.4vw,30px);font-weight:650;letter-spacing:-.01em}
.now .num{font-size:15px;color:var(--muted);margin-bottom:6px}
.nav{display:flex;gap:10px;flex-shrink:0}
button{font:inherit;cursor:pointer}
.btn{border:2.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:16px;font-weight:600;padding:10px 16px;border-radius:0}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:default;background:var(--paper);color:var(--ink)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* transcript */
.tr{margin-top:22px;border-top:2px solid var(--line)}
.tr summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-size:18px;font-weight:650}
.tr summary::-webkit-details-marker{display:none}
.tr summary::after{content:"+";font-size:24px;font-weight:500}
.tr[open] summary::after{content:"−"}
.tr ol{list-style:none;margin:0;padding:0 0 8px;max-height:340px;overflow:auto}
.tr li button{display:grid;grid-template-columns:56px 1fr;gap:12px;width:100%;text-align:right;background:none;border:0;padding:9px 8px;font-size:17px;line-height:1.5;color:var(--ink)}
.tr li button:hover{background:rgba(255,255,255,.55)}
.tr li button.on{background:var(--ink);color:var(--paper)}
.tr .t{font-size:14px;color:inherit;opacity:.6;direction:ltr;text-align:left;padding-top:3px;font-feature-settings:"tnum" 1}
/* chapter list: every row is a feature control frame */
.list h3{font-size:15px;font-weight:600;color:var(--muted);margin:22px 0 8px}
.list h3:first-child{margin-top:0}
.ch{display:grid;grid-template-columns:60px 1fr 64px;width:100%;border:2.5px solid var(--line);background:var(--paper);color:var(--ink);padding:0;margin-top:-2.5px;text-align:right}
.ch>span{display:flex;align-items:center;min-height:56px;padding:0 14px}
.ch .s{justify-content:center;border-left:2.5px solid var(--line);padding:0}
.ch .n{font-size:17px;font-weight:600;gap:10px}
.ch .n small{font-size:13px;font-weight:500;opacity:.55;font-feature-settings:"tnum" 1}
.ch .d{justify-content:center;border-right:2.5px solid var(--line);font-size:14px;direction:ltr;font-feature-settings:"tnum" 1;padding:0}
.ch svg{width:30px;height:30px;overflow:visible}
.ch:hover{background:#F1EFEB}
.ch.on{background:var(--ink);color:var(--paper)}
.ch.on .s,.ch.on .d{border-color:var(--paper)}
.ch.seen .d::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;margin-left:6px}
footer{margin-top:48px;font-size:14px;color:var(--muted);line-height:1.6}
@media (max-width:1000px){
  .wrap{padding:20px 16px 48px}
  header{flex-direction:column;align-items:flex-start}
  .grid{grid-template-columns:1fr}
  .player{position:static}
  .list{order:0}
  .now{flex-direction:column;align-items:flex-start}
}
body.embed .wrap{padding:16px 16px 20px;max-width:none}
body.embed header,body.embed footer{display:none}
@media (min-width:1001px){body.embed .list{max-height:calc(100vh - 36px);overflow:auto;padding-inline-start:4px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

$("next").addEventListener("click", () => go(cur + 1, true));
v.addEventListener("ended", () => { seen.add(cur); save(); if (cur < CH.length - 1) go(cur + 1, true); else go(cur, false); });
v.addEventListener("timeupdate", () => {
  if (v.duration && v.currentTime / v.duration > .9 && !seen.has(cur)) { seen.add(cur); save(); document.querySelector(`.ch[data-i="${cur}"]`)?.classList.add("seen"); }
  const cues = CH[cur].cues; let k = -1; for (let j = 0; j < cues.length; j++) if (v.currentTime >= cues[j][0] - .1) k = j;
  $("lines").querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.k === k));
});
addEventListener("hashchange", () => { const i = parseInt(location.hash.slice(1), 10); if (!isNaN(i) && i !== cur) go(i, false); });
const h = parseInt(location.hash.slice(1), 10); go(isNaN(h) ? 0 : Math.min(Math.max(h, 0), CH.length - 1), false);
</script>
</body>
</html>
