<style>
:root{--bg:#0d1117;--surface:#161b22;--card:#1c2128;--border:#30363d;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--text:#e6edf3;--muted:#8b949e;--font:'Segoe UI',system-ui,sans-serif}
html.light-mode,body.light-mode{--bg:#f5f7fa;--surface:#ffffff;--card:#eef1f5;--border:#d0d7de;--text:#1a1a2e;--muted:#57606a;--font:"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px}
.mh-cp-top{max-width:560px;margin:0 auto;padding:16px 4px 10px;display:flex;align-items:center;justify-content:space-between}
.mh-cp-logo{font-weight:900;font-size:18px;color:var(--blue);text-decoration:none}
.mh-cp-logo span{color:#ffa657}
html.light-mode .mh-cp-logo span{color:#bc4c00}
html.light-mode .mh-cp-logo{color:#0969da}
.mh-cp-back{font-size:13px;color:var(--muted);text-decoration:underline}
.mh-cp-wrap{padding:0 14px 24px}
.mh-cp-close{display:none;margin:4px auto 0;min-height:40px;padding:8px 22px;font:inherit;font-size:14px;font-weight:700;color:var(--text);background:transparent;border:1px solid var(--border);border-radius:10px;cursor:pointer}
.mh-cp-close:hover{border-color:var(--blue)}
</style>
</head>
<body>
<header class="mh-cp-top"><a class="mh-cp-logo" href="/en/" dir="ltr">METAL <span>HUB</span></a><a class="mh-cp-back" href="/en/">&#8592; Back to METAL HUB</a></header>
<main class="mh-cp-wrap">
<section class="mh-cf" dir="ltr" aria-labelledby="mh-cf-title">
  <h2 id="mh-cf-title">&#128236; Contact</h2>
  <p class="mh-cf-sub">A question, a comment on the site content, or an idea for a new topic? Leave a message and I will get back to you.</p>
  <form id="mh-cf-form" method="post" action="/contact.php">
    <div><label for="mh-cf-name">Name</label><input id="mh-cf-name" name="name" type="text" required maxlength="100" autocomplete="name" placeholder="Your name"></div>
    <div><label for="mh-cf-email">Email</label><input id="mh-cf-email" name="email" type="email" required maxlength="200" autocomplete="email" placeholder="name@example.com"></div>
    <div class="mh-cf-full"><label for="mh-cf-msg">Message</label><textarea id="mh-cf-msg" name="message" required minlength="5" maxlength="5000" placeholder="How can I help?"></textarea></div>
    <div class="mh-cf-hp" aria-hidden="true"><label for="mh-cf-web">Website</label><input id="mh-cf-web" name="website" type="text" tabindex="-1" autocomplete="off"></div>
    <input type="hidden" name="ts" value="">
    <input type="hidden" name="lang" value="en">
    <button type="submit" class="mh-cf-full">Send</button>
    <p class="mh-cf-status" role="status" aria-live="polite"></p>
  </form>
</section>
<style>
.mh-cf{position:relative;max-width:560px;margin:0 auto 24px;padding:22px 20px;background:var(--card);border:1px solid var(--border);border-radius:14px;text-align:start}
.mh-cf h2{margin:0 0 4px;font-size:17px;font-weight:800;color:var(--text);text-align:center}
.mh-cf .mh-cf-sub{margin:0 0 16px;font-size:13px;line-height:1.6;color:var(--muted);text-align:center}
.mh-cf form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mh-cf .mh-cf-full{grid-column:1/-1}
.mh-cf label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.mh-cf input,.mh-cf textarea{width:100%;box-sizing:border-box;padding:10px 12px;font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:9px;outline:none;transition:border-color .15s,box-shadow .15s}
.mh-cf textarea{min-height:120px;resize:vertical;line-height:1.5}
.mh-cf input:focus,.mh-cf textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
.mh-cf input[type=email]{direction:ltr;text-align:start}
.mh-cf .mh-cf-hp{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.mh-cf button{justify-self:center;min-width:160px;min-height:42px;padding:10px 24px;font:inherit;font-size:14px;font-weight:800;color:#0d1117;background:var(--blue);border:0;border-radius:10px;cursor:pointer;transition:filter .15s,opacity .15s}
.mh-cf button:hover{filter:brightness(1.1)}
.mh-cf button:disabled{opacity:.6;cursor:wait}
.mh-cf .mh-cf-status{grid-column:1/-1;margin:0;min-height:20px;font-size:13px;font-weight:600;text-align:center}
.mh-cf .mh-cf-status.ok{color:var(--green)}
.mh-cf .mh-cf-status.err{color:var(--red)}
html.light-mode .mh-cf .mh-cf-status.ok,body.light-mode .mh-cf .mh-cf-status.ok{color:#116329}
html.light-mode .mh-cf .mh-cf-status.err,body.light-mode .mh-cf .mh-cf-status.err{color:#cf222e}
@media (max-width:520px){.mh-cf form{grid-template-columns:1fr}.mh-cf{padding:18px 14px}}
</style>
<script>
(function(){
  var f=document.getElementById('mh-cf-form'); if(!f) return;
  var st=f.querySelector('.mh-cf-status'), btn=f.querySelector('button[type=submit]'), ts=f.querySelector('input[name=ts]');
  var M={"email": "The email address is not valid.", "message": "The message is too short.", "name": "Please enter your name.", "rate": "Too many messages were sent. Please try again in an hour.", "timing": "Please try sending again in a few seconds."}, OK="Your message was sent. Thank you! I will get back to you soon.", FAIL="Sending failed. Please try again later.", SEND="Send", SENDING="Sending…";
  ts.value=Date.now();
  function show(t,c){st.textContent=t;st.className='mh-cf-status '+(c||'');}
  f.addEventListener('submit',function(e){
    e.preventDefault();
    if(!f.checkValidity()){f.reportValidity();return;}
    btn.disabled=true; btn.textContent=SENDING; show('');
    fetch('/contact.php',{method:'POST',body:new FormData(f),credentials:'same-origin'})
      .then(function(r){return r.json().catch(function(){return {ok:false};});})
      .then(function(d){
        if(d&&d.ok){show(OK,'ok');f.reset();ts.value=Date.now();}
        else{show((d&&M[d.error])||FAIL,'err');}
      })
      .catch(function(){show(FAIL,'err');})
      .then(function(){btn.disabled=false;btn.textContent=SEND;});
  });
})();
</script>
<div style="text-align:center"><button type="button" class="mh-cp-close" onclick="window.close()">Close window</button></div>
</main>
<script>
(function(){ /* in the pop-up window, offer to close it after a successful send */
  var st=document.querySelector('.mh-cf-status'), btn=document.querySelector('.mh-cp-close');
  if(!st||!btn||window.name!=='mhcontact') return;
  new MutationObserver(function(){ btn.style.display = st.classList.contains('ok') ? 'block' : 'none'; }).observe(st,{attributes:true,childList:true,characterData:true,subtree:true});
})();
</script>
</body>
</html>
